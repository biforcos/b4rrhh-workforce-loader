spring:
  main:
    web-application-type: none

loader:
  backend:
    # El /api va aqui y no en cada ruta: los dos clientes tienen catorce rutas
    # relativas a esta base, y asi el prefijo se toca en un solo sitio.
    base-url: ${LOADER_BASE_URL:http://localhost:8080/api}
    # Nunca en el repositorio: este repo es publico. Consiguelo con el backend
    # arrancado en perfil local:
    #   POST http://localhost:8080/api/dev/auth/token  {"subject":"bifor"}
    # y exportalo:  $env:LOADER_AUTH_TOKEN = "eyJ..."   (PowerShell)
    auth-token: ${LOADER_AUTH_TOKEN:}
    hire-path: /employees/hire

    # Con quien tiene que estar hablando esta corrida. Sin esto no arranca, y
    # es a proposito: un token bueno del backend equivocado devuelve 200 igual
    # que el bueno del correcto, asi que la comprobacion no puede ser "me han
    # autenticado" sino "esta es la base a la que iba a escribir"
    # (workforce-loader#8).
    #
    # No hay valor por defecto porque no lo hay: solo la corrida sabe cual era
    # la respuesta buena. Se pregunta al backend arrancado con:
    #   GET http://localhost:8080/api/system/target   (token de ADMIN)
    #
    # Tambien por entorno, sin tocar este fichero:
    #   LOADER_BACKEND_EXPECTED_DATABASE, LOADER_BACKEND_EXPECTED_EMPLOYEES,
    #   LOADER_BACKEND_EXPECTED_SCHEMA_VERSION
    expected:
      # host:puerto/nombre, por ejemplo localhost:5432/b4rrhh_wl7. Con host y
      # puerto, no solo el nombre: la base de la demo y la de desarrollo se
      # llaman las dos b4rrhh, asi que el nombre suelto no distingue el caso
      # que mas dano hace.
      database:
      # Los que tiene que haber ya. Una siembra desde cero espera 0.
      employees:
      # Opcional. Cuando se declara, se comprueba.
      schema-version:

    # No basta comprobarlo al arrancar: el backend del 8080 se puede sustituir
    # a mitad de corrida.
    recheck-every-writes: 200

  run:
    mode: LIFECYCLE
    # En seco por omision, y no por simetria con la documentacion: por el
    # reparto de costes (workforce-loader#9). Con false, equivocarse cuesta una
    # base escrita y una hora de reconstruirla; con true cuesta una bandera que
    # hay que volver a poner. Cuando los dos errores no cuestan igual, el
    # defecto va del lado barato.
    #
    # Una corrida de verdad es un acto deliberado de todas formas —hay que
    # rellenar expected.database y expected.employees a mano—, asi que la
    # bandera no estorba a quien sabe lo que hace; estorbaba a quien no lo
    # sabia. Y la guarda del workforce-loader#8 no cubre este caso: comprueba a
    # DONDE se escribe, no SI se escribe, asi que con las expectativas bien
    # puestas una corrida que alguien creia en seco escribe mil empleados en la
    # base correcta y el informe sale perfecto.
    #
    # Para escribir de verdad, en la linea de ordenes, que gana a todo:
    #   mvn spring-boot:run -Dspring-boot.run.arguments=--loader.run.dry-run=false
    dry-run: true

  defaults:
    rule-system-code: ESP
    # El catalogo EMPLOYEE_TYPE de ESP tiene dos codigos, INTERNAL y EXTERNAL,
    # y el loader usa solo el primero a proposito. EXTERNAL existe para que el
    # mecanismo (una de las cuatro dimensiones de ambito de concept_assignment)
    # tenga con que probarse, pero nadie le ha dado significado todavia: no hay
    # ninguna asignacion de nomina acotada a el, ni comportamiento asociado
    # (backend#38). Dar de alta gente como EXTERNAL seria inventar que quiere
    # decir. Cuando backend#38 lo defina, esto pasa a ser un reparto
    # (workforce-loader#5).
    employee-type-code: INTERNAL

  generation:
    count: 1000
    seed: 12345
    employee-number-prefix: EMP
    employee-number-padding: 6
    # NO es una fecha puesta a ojo: es el dia desde el que el sistema de reglas
    # ESP soporta contratar de verdad, y esta medido.
    #
    # Los tipos de contrato de la reforma laboral arrancan el 2022-03-30
    # (RDL 32/2021), pero la relacion entre el convenio de grandes almacenes y
    # sus categorias no entra en vigor hasta el 2023-01-01. Antes de esa fecha
    # el backend rechaza el alta con INVALID_CATALOG_VALUE, y hace bien: esa
    # combinacion no existia.
    #
    # Si algun dia se siembran los codigos anteriores a la reforma con su
    # caducidad, esta fecha se puede bajar. Se comprueba asi, buscando el primer
    # dia que devuelva algo:
    #   GET /labor-classification-catalog/agreement-categories
    #       ?ruleSystemCode=ESP&agreementCode=<convenio>&referenceDate=<fecha>
    hire-date-from: 2023-01-01
    hire-date-to: 2026-05-01
    working-time-percentage: 100

  simulation:
    terminate-rate: 0.60
    rehire-rate-of-terminated: 0.80
    termination-min-days-after-hire: 6
    termination-max-days-after-hire: 180
    rehire-min-days-after-termination: 15
    rehire-max-days-after-termination: 120
    work-center-change-rate: 0.35
    contract-replace-rate: 0.25
    labor-classification-replace-rate: 0.25
    cost-center-replace-rate: 0.20

  # El mes partido de la demo. Unos cuantos empleados cambian de jornada a mitad
  # de mes para que los conceptos SEGMENT (ADR-058) tengan dos tramos con precio
  # distinto: SALARIO_BASE sale en dos lineas y la base de cotizacion del mes es
  # la suma de las dos, que es justo lo que backend#64 midio y no se podia
  # ensenar sin un empleado asi.
  #
  # Esto lo hace el loader, por API, y NO una migracion. La V118 lo intentaba con
  # un UPDATE sobre EMP001000 y no podia funcionar: Flyway corre al arrancar el
  # backend y los empleados los crea el loader despues, asi que el UPDATE tocaba
  # cero filas y la migracion terminaba en verde igual (backend#74).
  #
  # La fecha va escrita y no se saca del reloj, como el resto de la generacion:
  # tiene que caer dentro del periodo que la demo calcula, y la misma semilla
  # tiene que dar lo mismo cualquier dia.
  working-time-change:
    enabled: true
    date: 2026-09-16
    percentage: 50
    employees: 5

  # Las horas extra de la demo: la tercera de las tres tablas vacias del
  # workforce-loader#5, y la ultima que quedaba. Estuvo a cero a proposito desde
  # septiembre: ningun concepto del motor declaraba EMPLOYEE_INPUT, asi que
  # sembrarla habria metido filas con un codigo que no existia en ningun sitio.
  # Lo declaro el b4rrhh/backend#104 —H01 son las horas, el 102 lo que se cobra
  # por ellas— y con el llego tambien la regla que lo hacia posible: una linea
  # de concepto a cero no se imprime, asi que declarar el concepto para todo el
  # convenio no ensucia el recibo de quien no tiene horas.
  #
  # Solo una parte de la plantilla, y ese es el punto: un plus que cobran los mil
  # no ensena nada que no ensene ya el salario base. concept_assignment no puede
  # acotar por empleado —acota por sociedad, convenio y tipo—, asi que lo que
  # distingue a unos de otros es tener fila aqui o no tenerla.
  #
  # El periodo va escrito y no sale del reloj, igual que la fecha del mes
  # partido: una entrada en un mes que la demo no calcula no se ve en ninguna
  # pantalla, y la misma semilla tiene que dar lo mismo cualquier dia.
  payroll-input:
    enabled: true
    concept-code: H01
    period: 202609
    rate: 0.25
    min-hours: 4
    max-hours: 20

  # Los centros salen del catalogo COST_CENTER del sistema de reglas; aqui solo
  # se apaga el reparto. Antes habia una lista de centros que nadie rellenaba y
  # con ella vacia no se generaba ni una fila (workforce-loader#5).
  cost-center:
    enabled: true

  filters:
    # Hoy esto no excluye nada: desde backend#6 el catalogo AGREEMENT de ESP
    # tiene un solo convenio, el real, y estas tres son sus unicas categorias.
    # Los inventados de la semilla base —AGR_OFFICE y AGR_TECH, con sus
    # CAT_ADMIN / CAT_TECH_*— los retiraron las migraciones V121 y V122.
    #
    # Se queda, y a proposito, por dos motivos. Uno, declarar contra que
    # convenio siembra el loader es informacion, no ruido. Y dos, es la red:
    # el filtro nacio (workforce-loader#5) porque un empleado bajo un convenio
    # sin asignacion de conceptos se da de alta bien y luego no tiene nomina
    # calculable, y la demo calcula nominas. El dia que entre un segundo
    # convenio al catalogo, el loader seguira sembrando lo que sabe calcular en
    # vez de repartir empleados en silencio entre convenios sin grafo.
    #
    # Es decir: paso de ser un filtro a ser una declaracion de intenciones, y
    # sigue siendo el aviso de que ampliarlo es una decision, no un descuido.
    agreement-code: 99002405011982
    agreement-category-codes:
      - 99002405-G1
      - 99002405-G2
      - 99002405-G3
    # Este tampoco excluye ya nada, y por el mismo motivo: era el catalogo, no
    # el loader. Desde backend#76 el catalogo CONTRACT de ESP tiene solo los
    # diez tipos legales (100, 108, ..., 422) y CONTRACT_SUBTYPE solo el 01.
    # Los genericos de la semilla base —IND y TMP, con sus FT1 / PT1 / INT—
    # los retiro la migracion V123. Este comentario decia donde estaba el
    # arreglo; ahi se hizo.
    #
    # Se queda, y por los dos mismos motivos que agreement-code. Uno, declarar
    # que el loader siembra tipos de contrato reales es informacion: por esto
    # contract_subtype_code es siempre 01, porque es el unico subtipo que los
    # diez legales tienen relacionado. Y dos, es la red: el dia que entre al
    # catalogo un codigo que no sea un tipo legal —otro sistema de reglas, un
    # tipo a medida— el loader seguira contratando con los que si lo son en vez
    # de repartir empleados en silencio entre codigos sin norma detras
    # (workforce-loader#5, backend#76).
    numeric-contract-types-only: true
    require-contract-subtype: true
