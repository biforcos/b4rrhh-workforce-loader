spring:
  main:
    web-application-type: none

loader:
  backend:
    # El /api va aqui y no en cada ruta: los dos clientes tienen catorce rutas
    # relativas a esta base, y asi el prefijo se toca en un solo sitio.
    base-url: ${LOADER_BASE_URL:http://localhost:8080/api}
    # Nunca en el repositorio: este repo es publico. Consiguelo con el backend
    # arrancado en perfil local:
    #   POST http://localhost:8080/api/dev/auth/token  {"subject":"bifor"}
    # y exportalo:  $env:LOADER_AUTH_TOKEN = "eyJ..."   (PowerShell)
    auth-token: ${LOADER_AUTH_TOKEN:}
    hire-path: /employees/hire

  run:
    mode: LIFECYCLE
    dry-run: false

  defaults:
    rule-system-code: ESP
    employee-type-code: INTERNAL

  generation:
    count: 10000
    seed: 12345
    employee-number-prefix: EMP
    employee-number-padding: 6
    hire-date-from: 2020-01-01
    hire-date-to: 2026-05-01
    working-time-percentage: 100

  simulation:
    terminate-rate: 0.60
    rehire-rate-of-terminated: 0.80
    termination-min-days-after-hire: 6
    termination-max-days-after-hire: 180
    rehire-min-days-after-termination: 15
    rehire-max-days-after-termination: 120
    work-center-change-rate: 0.35
    contract-replace-rate: 0.25
    labor-classification-replace-rate: 0.25
    cost-center-replace-rate: 0.20

  cost-center:
    enabled: false
    items: []

  filters:
    agreement-code: 99002405011982
    agreement-category-codes:
      - 99002405-G1
      - 99002405-G2
      - 99002405-G3
    numeric-contract-types-only: true
    require-contract-subtype: true
